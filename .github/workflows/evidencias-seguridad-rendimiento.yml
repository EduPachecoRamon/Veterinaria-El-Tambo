name: Evidencias de seguridad y rendimiento HTTP
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidencia-http:
    name: Seguridad no destructiva y tiempos HTTP
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar autenticación, validaciones y cabeceras de la API pública
        run: node scripts/prueba_seguridad_http.mjs
        env:
          API_URL: https://vet-tambo-api.onrender.com/api
      - name: Medir latencia de consulta HTTP (7 repeticiones)
        run: node scripts/prueba_rendimiento_http.mjs
        env:
          API_URL: https://vet-tambo-api.onrender.com/api
      - name: Guardar evidencia verificable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-seguridad-rendimiento-http
          path: evidencia-ci/*.json
          retention-days: 30
